# The upstream project is cloned in a parent pipeline

.use-clone:
  pipeline: ${PARENT_PIPELINE}
  job: clone

# A special job for compiling the tinker interface with get_tinker
# (the same script users run). By adding "tinker" as a dependency, other
# jobs can use it, it is found in build/tinker/bin. Jobs that need it should
# also set require_features: "tinker", so that a missing Tinker is an error
# and not silently skipped tests.

tinker:
  stage: build
  image: ${CI_REGISTRY}/molcas/dockerfiles/gcc-9:latest
  interruptible: true
  before_script:
    - >
      if ( ! which patch ) ; then apt-get install -y --no-install-recommends patch ; fi
  script:
    # change into the cloned subdirectory if necessary
    - |
      if [ -n "${CLONED_DIR}" ] ; then
        cd ${CLONED_DIR}
      fi
    # Use the Molcas mirror of the Tinker tarballs (the checksum is verified by get_tinker)
    - git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/Molcas/Mirrors/Tinker.git ${CI_PROJECT_DIR}/tinker_mirror
    # -a 1000: low-memory build (fewer MM atoms)
    # -r 10: try to work around https://gcc.gnu.org/bugzilla/show_bug.cgi?id=92318
    - Tools/patch2tinker/get_tinker -y -p ${CI_PROJECT_DIR}/tinker_build -t ${CI_PROJECT_DIR}/tinker_mirror -a 1000 -r 10 -j 2
    # Keep only what is needed at run time (and no symlinks)
    - mkdir -p ${CI_PROJECT_DIR}/build/tinker
    - cp -Lr ${CI_PROJECT_DIR}/tinker_build/tinker/bin ${CI_PROJECT_DIR}/tinker_build/tinker/params ${CI_PROJECT_DIR}/build/tinker
    - test -x ${CI_PROJECT_DIR}/build/tinker/bin/tkr2qm_s
  artifacts:
    paths:
      - build/
    expire_in: 1 day
  rules: !reference [.compile-jobs, rules]
  needs:
    - !reference [.use-clone]

# A special job to check that all the tests have been run somewhere

check_tests:
  stage: .post
  interruptible: true
  script:
    - export PROJECT_DIR=${CI_PROJECT_DIR}/${CLONED_DIR}
    - |
      if ( ! which python && which python3 ) ; then
        sed -i -e 's/env python/env python3/' ${PROJECT_DIR}/Tools/verify/check_tests.py
      fi
    - ${PROJECT_DIR}/Tools/verify/check_tests.py
  rules: !reference [.test-jobs, rules]
  needs:
    - !reference [.use-clone]
    - test:bounds
    - test:garble
    - test:intel13
    - test:intel
    - test:intel_llvm
    - test:linalg
    - test:mpi
    - test:nag
    - test:options
    - test:pgi
    - test:plain
    - test:qcmaquis

# Define the actual jobs, each job has a "build" and a "test" stage,
# the latter depends on the former.

build:plain:
  extends:
    - .compile
    - .plain
test:plain:
  extends:
    - .run-tests
    - .plain
  needs:
    - !reference [.use-clone]
    - build:plain
  parallel: 2

build:options:
  extends:
    - .compile
    - .options
test:options:
  extends:
    - .run-tests
    - .options
  needs:
    - !reference [.use-clone]
    - build:options
  variables:
    require_features: "tinker"
  parallel: 2

build:linalg:
